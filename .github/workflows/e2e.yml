name: E2E Tests

# Triggers after every Vercel deployment (production + preview).
# For preview deployments to include a live Convex backend:
#   1. Generate a Preview Deploy Key in the Convex dashboard (Project Settings)
#   2. Add it as CONVEX_DEPLOY_KEY in Vercel (Environment: Preview only)
# vercel.json sets the build command to `npx convex deploy --cmd 'pnpm build'`,
# which creates a fresh Convex backend for each preview automatically.

on:
  deployment_status:

jobs:
  e2e:
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          BASE_URL: ${{ github.event.deployment_status.target_url }}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
